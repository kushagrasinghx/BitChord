name: Automix + BPM/key + Spotify toggle (release-like APK)

# Chạy tay: tab Actions -> chọn workflow này -> Run workflow.
# Gom TẤT CẢ trong một lần build, chép vào bản sao tạm của repo trên máy chủ:
#   1. Nút Mix + ghi đè từng cặp bài (giống workflow "Automix Mix button + ban muot")
#   2. Hiện BPM và key (kèm mã Camelot) của bài đang phát
#   3. Công tắc bật/tắt Spotify Canvas (trong Cài đặt VÀ nút camera ngay trên trình phát)
#   4. Nút Mix có thêm kiểu chuyển bài: Cổ điển, Cắt nhanh (1 giây), Mờ dài (12 giây)
#   5. Trong Cài đặt > Automix: thời điểm mix (30 giây cuối) và kiểu nối khi lệch nhịp
# Build "benchmark": R8 + baseline profile, không debuggable, ký bằng khoá debug,
# gói riêng com.dev.bitchord.benchmark nên cài song song với bản dev/prod.
# KHÔNG commit gì vào repo của bạn. Đừng chạy chung với workflow "Automix Mix button + ban muot":
# bản này đã chứa sẵn các thay đổi của nó.
# Nếu build lỗi: tải artifact "build-log" (chỉ có khi lỗi) rồi gửi lại để sửa.

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Chạy test của module shared trước khi build (lâu hơn, nhưng kiểm tra được code mới)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Apply the combined changes
        run: |
          echo "" | base64 -d | tar -xz
          patch -p1 --no-backup-if-mismatch < bitchord-combined.patch
          rm bitchord-combined.patch

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=" > local.properties
          echo "LASTFM_SECRET=" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=" >> local.properties

      - run: chmod +x gradlew

      - name: Shared tests
        if: ${{ inputs.run_tests }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :shared:jvmTest 2>&1 | tee build.log

      - name: Build the release-like dev APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDevBenchmark 2>&1 | tee -a build.log

      - name: List the APKs
        run: ls -la app/build/outputs/apk/dev/benchmark/

      - name: Upload the arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-dev-benchmark-arm64
          path: app/build/outputs/apk/dev/benchmark/*arm64-v8a*.apk
          if-no-files-found: error

      - name: Upload the build log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
