name: Contributors Image

# Redraws the README's contributor grid. The image lives on its own
# `contributors` branch because main only takes pull requests, so a bot
# commit there is rejected.
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

concurrency:
  group: contributors-image
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Draw contributor grid
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          mkdir out
          python3 .github/scripts/contributors_svg.py out/contributors.svg

      - name: Publish to the contributors branch if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if git fetch -q --depth=1 origin contributors 2>/dev/null \
             && git show FETCH_HEAD:contributors.svg 2>/dev/null | cmp -s - out/contributors.svg; then
            echo "Unchanged."
            exit 0
          fi
          cd out
          git init -q -b contributors
          git add contributors.svg
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update contributors image"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" contributors
