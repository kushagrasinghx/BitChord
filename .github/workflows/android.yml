name: Android CI

on: [push, pull_request]

jobs:
  build-dev-debug:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup local.properties
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Dev Debug APK
      run: ./gradlew assembleDevDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-dev-debug
        path: app/build/outputs/apk/dev/debug/*.apk

  build-prod-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bitchord-release.jks
        echo "storeFile=bitchord-release.jks" > keystore.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Verify pitch model packaged
      run: |
        ls app/build/outputs/apk/prod/release/
        unzip -l app/build/outputs/apk/prod/release/app-prod-universal-release.apk | grep crepe_tiny.onnx

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-prod-release-signed
        path: app/build/outputs/apk/prod/release/*.apk

  publish-release:
    if: github.ref == 'refs/heads/main'
    needs: build-prod-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download APK Artifact
      uses: actions/download-artifact@v4
      with:
        name: bitchord-prod-release-signed
        path: dist

    - name: Create public release with APK
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="v1.5.2-${{ github.run_number }}"
        NOTES="Automated prod release (build ${{ github.run_number }}, commit ${{ github.sha }}).
        DJ Automix: beat-matched blends, isolator bass swap, gain-staged reverb/echo, click-free handoffs."
        gh release create "$TAG" dist/*.apk \
          --repo "ngocthanhgl/BitChord" \
          --title "BitChord DJ Mix v1.5.2 (build ${{ github.run_number }})" \
          --notes "$NOTES"
