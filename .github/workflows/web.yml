name: Web

# The web player (web/app), its browser extension (web/extension) and the code
# they share (web/shared): typecheck, test and build all three, so a change
# that only breaks the production build (Vite, WXT) is caught before it ships.
#
# The web player also runs the Android app's own logic: shared/src/commonMain,
# compiled to JavaScript in web/shared-kotlin/dist. The shared-kotlin job keeps
# that copy current, so a change to shared/ reaches the web without anyone
# porting it: on a branch of this repository it commits the regenerated files
# itself; on a fork's PR, which it can't push to, it fails and names the
# command (main's ruleset stops CI pushing there after a merge, so the copy must
# be current before it). Once web-deploy.yml deploys the site with shared/
# compiled fresh (WEB_DEPLOY_FROM_ACTIONS), a stale copy only warns: nothing
# ships it. The web job always tests the fresh build.
on:
  push:
    branches: [main]
    paths: &paths
      - 'web/**'
      - 'shared/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      # styles/tokens.test.ts checks the web's colours against it: fail the PR that changes it.
      - 'app/src/main/java/com/music/bitchord/ui/theme/Theme.kt'
      - '.github/workflows/web.yml'
  pull_request:
    paths: *paths

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-kotlin:
    name: Web · shared Kotlin up to date
    runs-on: ubuntu-latest
    permissions:
      # To commit the regenerated files back to a branch of this repository.
      contents: write
    outputs:
      exported: ${{ steps.exported.outputs.done }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A PR's own branch, so the update can be committed onto it.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # shared/'s own tests first: the web runs this code, and no other workflow tests shared/.
      - name: Test shared/ and regenerate web/shared-kotlin
        run: ./gradlew :shared:jvmTest :shared:exportWeb

      # What the web job tests, so it checks this change's shared/ even where nothing can be committed.
      - uses: actions/upload-artifact@v4
        with:
          name: shared-kotlin
          path: web/shared-kotlin/dist

      # Lets the web job run even when the next step fails a fork's PR, so it still gets test results.
      - id: exported
        run: echo "done=true" >> "$GITHUB_OUTPUT"

      - name: Commit it, or say how
        env:
          SAME_REPO: ${{ !github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository }}
          DEPLOY_FROM_ACTIONS: ${{ vars.WEB_DEPLOY_FROM_ACTIONS }}
        run: |
          if git diff --quiet -- web/shared-kotlin && [ -z "$(git ls-files --others --exclude-standard web/shared-kotlin)" ]; then
            echo "web/shared-kotlin matches shared/."
            exit 0
          fi
          # web-deploy.yml compiles shared/ itself, so a copy CI can't commit (a fork, or main) ships nowhere.
          if [ "$DEPLOY_FROM_ACTIONS" = "true" ] && { [ "$SAME_REPO" != "true" ] || [ "$GITHUB_EVENT_NAME" = "push" ]; }; then
            echo "::warning file=web/shared-kotlin/README.md::web/shared-kotlin is behind shared/. The site is deployed with shared/ compiled fresh, so nothing to do; ./gradlew :shared:exportWeb refreshes it locally."
            exit 0
          fi
          # main's ruleset only takes reviewed PRs, so CI can't push there: say so rather than fail on a refused push.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "::warning file=web/shared-kotlin/README.md::main's web/shared-kotlin is behind shared/. Refresh it in a PR (./gradlew :shared:exportWeb)."
            exit 0
          fi
          # A fork can't be pushed to either, so the fork's PR carries the regenerated copy itself.
          if [ "$SAME_REPO" != "true" ]; then
            echo "::error file=web/shared-kotlin/README.md::shared/ changed, so the web player's copy of it is stale. Run ./gradlew :shared:exportWeb and commit web/shared-kotlin."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add web/shared-kotlin
          git commit -m "chore(web): regenerate shared-kotlin from shared/"
          git push
          echo "::notice::Committed the regenerated web/shared-kotlin."

  web:
    name: Web · typecheck, test, build
    needs: shared-kotlin
    # Also when shared-kotlin failed a fork's PR over its committed copy: the fresh build is in the artifact.
    if: ${{ !cancelled() && needs.shared-kotlin.outputs.exported == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      # The branch's tip, so a shared-kotlin regeneration committed above is what gets tested.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      # The shared-kotlin job's fresh build: the same as the committed copy unless that one couldn't be updated.
      - uses: actions/download-artifact@v4
        with:
          name: shared-kotlin
          path: web/shared-kotlin/dist

      # The pnpm version comes from web/package.json's packageManager.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The app's build runs tsc then vite; the extension's builds Chrome and Firefox.
      # The real party server is a Cloudflare Pages variable; this build is
      # never deployed, it only needs a value to get past vite.config.ts.
      - name: Build
        run: pnpm build
        env:
          VITE_PARTY_SERVER_URL: https://party.example.com
