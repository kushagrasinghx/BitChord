name: Track All-Time Downloads

on:
  schedule:
    - cron: '0 */6 * * *' # Run every 6 hours
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and compute all-time downloads
        run: |
          mkdir -p stats
          EXISTING_TOTAL=0
          if [ -f stats/downloads.json ]; then
            EXISTING_TOTAL=$(jq -r '.allTimeTotal // .message // 0' stats/downloads.json 2>/dev/null || echo 0)
          fi

          echo "Existing lifetime total: $EXISTING_TOTAL"

          # Query GitHub API for all releases and calculate cumulative sum
          CURRENT_RELEASES_SUM=$(curl -s -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases" | \
            jq '[.[].assets[].download_count] | add // 0')

          echo "Current releases download sum: $CURRENT_RELEASES_SUM"

          # Lifetime total is always the max to guarantee it NEVER resets or goes down
          if [ "$CURRENT_RELEASES_SUM" -gt "$EXISTING_TOTAL" ]; then
            LIFETIME_TOTAL=$CURRENT_RELEASES_SUM
          else
            LIFETIME_TOTAL=$EXISTING_TOTAL
          fi

          echo "Updated lifetime total: $LIFETIME_TOTAL"

          # Write Shield endpoint JSON format
          cat <<EOF > stats/downloads.json
          {
            "schemaVersion": 1,
            "label": "Total Downloads",
            "message": "${LIFETIME_TOTAL}",
            "color": "brightgreen",
            "allTimeTotal": ${LIFETIME_TOTAL}
          }
          EOF
          jq . stats/downloads.json > stats/downloads.tmp && mv stats/downloads.tmp stats/downloads.json

      - name: Commit and push updated stats
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add stats/downloads.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(stats): update persistent all-time download count [skip ci]"
            git push origin ${{ github.ref_name }}
          else
            echo "No change in download count."
          fi
