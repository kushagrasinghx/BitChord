name: Android APK

on:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:
    inputs:
      flavor:
        description: APK package to build
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      # Feature builds install beside the regular app; main keeps the prod package.
      APK_FLAVOR: ${{ inputs.flavor || (github.ref_name == 'main' && 'prod' || 'dev') }}
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
        echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bitchord-release.jks
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Write the debug keystore (if available)
      env:
        DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      run: |
        [ -n "$DEBUG_KEYSTORE_BASE64" ] || exit 0
        mkdir -p ~/.android
        echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

    - name: Verify Automix models
      run: python3 scripts/automix_models.py check

    - name: Build Debug APK
      run: |
        if [ "$APK_FLAVOR" = "dev" ]; then
          ./gradlew :app:assembleDevDebug
        else
          ./gradlew :app:assembleProdDebug
        fi

    - name: Test Automix source selection
      if: env.APK_FLAVOR == 'dev'
      run: ./gradlew :app:testDevDebugUnitTest --tests com.music.bitchord.AutomixAnalysisSourceTest

    - name: Verify Universal APK
      run: |
        apk_dir="app/build/outputs/apk/$APK_FLAVOR/debug"
        apk="$(find "$apk_dir" -maxdepth 1 -name '*universal*.apk' -print -quit)"
        test -n "$apk"
        build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
        "$build_tools/apksigner" verify --verbose --print-certs "$apk" | tee "$apk_dir/apk-verification.txt"
        "$build_tools/aapt2" dump badging "$apk" | tee -a "$apk_dir/apk-verification.txt"
        sha256sum "$apk" | tee -a "$apk_dir/apk-verification.txt"

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-${{ env.APK_FLAVOR }}-debug
        if-no-files-found: error
        path: |
          app/build/outputs/apk/${{ env.APK_FLAVOR }}/debug/*.apk
          app/build/outputs/apk/${{ env.APK_FLAVOR }}/debug/output-metadata.json
          app/build/outputs/apk/${{ env.APK_FLAVOR }}/debug/apk-verification.txt

    - name: Build Signed Prod Release APK (if secret available)
      if: env.APK_FLAVOR == 'prod' && env.HAS_KEYSTORE == 'true'
      run: ./gradlew assembleProdRelease

    - name: Upload Release APK Artifact
      if: env.APK_FLAVOR == 'prod' && env.HAS_KEYSTORE == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-prod-release-signed
        path: app/build/outputs/apk/prod/release/*.apk

    # Built by the same assembleProdRelease, with the same key. The watch app
    # only pairs with a phone app signed by the same key, so a prod watch APK
    # for these phone builds can only come from here, never a local build.
    - name: Upload Wear OS APK Artifact
      if: env.APK_FLAVOR == 'prod' && env.HAS_KEYSTORE == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-wear-prod-release-signed
        path: wearos/build/outputs/apk/prod/release/*.apk
