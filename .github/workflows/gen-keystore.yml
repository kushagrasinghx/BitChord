# THROWAWAY helper — generates a release keystore on a GitHub-hosted runner and
# prints the four values to paste into repository secrets (KEYSTORE_BASE64,
# KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) for android.yml to use.
#
# Run it ONCE, save the values + the keystore artifact, then delete this file
# and the workflow run. Never re-run it after people have installed the app:
# a fresh key means no existing install can ever be updated again.
name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore and print secret values
        run: |
          STORE_PASS=$(openssl rand -base64 18)
          KEY_PASS=$(openssl rand -base64 18)
          keytool -genkeypair -v \
            -keystore bitchord-release.jks \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -alias bitchord \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=BitChord, OU=Dev, O=BitChord, C=IN"
          echo ""
          echo "========== COPY THESE 4 LINES INTO GITHUB SECRETS =========="
          echo "KEYSTORE_PASSWORD=$STORE_PASS"
          echo "KEY_ALIAS=bitchord"
          echo "KEY_PASSWORD=$KEY_PASS"
          echo "KEYSTORE_BASE64=$(base64 -w0 bitchord-release.jks)"
          echo "============================================================"

      - name: Upload keystore (your backup — keep it forever)
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-release-jks
          path: bitchord-release.jks
