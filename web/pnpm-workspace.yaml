packages:
  - app
  - extension
  - shared
  - desktop
minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.104.3'
  - '@tanstack/react-query@5.104.3'
  - react-dom@19.3.1
  - react@19.3.1
# protobufjs (via onnxruntime-web) has a postinstall that sets up its Node CLI;
# the browser never runs it. pnpm in CI (Cloudflare Pages) fails on any
# unapproved install script, so it is declined here, explicitly.
allowBuilds:
  protobufjs: false
  # The desktop app (web/desktop): esbuild's postinstall checks its native
  # binary; electron-winstaller's is for Squirrel installers, which the
  # NSIS build doesn't use.
  esbuild: true
  electron-winstaller: false
