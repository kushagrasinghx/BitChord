name: Automix override v1 (test + dev APK)

# Chay tay: tab Actions -> "Automix override v1" -> Run workflow.
# Workflow chep 3 file moi + 1 ban va vao ban sao tam cua repo tren may chu,
# chay test, build APK dev debug. Khong commit gi vao repo cua ban.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Apply the Automix override changes
        run: |
          echo "" | base64 -d | tar -xz
          patch -p1 < automix-override-v1.patch
          rm automix-override-v1.patch

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=" > local.properties
          echo "LASTFM_SECRET=" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=" >> local.properties

      - run: chmod +x gradlew

      - name: Shared tests (includes the new override tests)
        run: ./gradlew :shared:jvmTest

      - name: App unit tests
        run: ./gradlew testDevDebugUnitTest

      - name: Build the dev APK
        run: ./gradlew assembleDevDebug

      - name: Upload the dev APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-dev-debug-automix-override
          path: app/build/outputs/apk/dev/debug/*.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            app/build/reports/tests/
