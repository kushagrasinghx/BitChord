name: Build Test Linux

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (without leading v)"
        required: false
        default: "1.8.0-test"
      run_tests:
        description: "Run desktop tests before packaging"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Build DEB and AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Linux packaging tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot
          curl -fsSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage

      - name: Write local.properties
        shell: bash
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: Make build scripts executable
        shell: bash
        run: |
          chmod +x gradlew
          chmod +x desktopApp/packaging/appimage.sh

      - name: Run desktop tests
        if: ${{ inputs.run_tests }}
        run: ./gradlew :shared:jvmTest :desktopApp:test "-Pbitchord.version=${{ inputs.version }}"

      - name: Build Linux distributable and DEB
        run: |
          ./gradlew :desktopApp:createDistributable :desktopApp:packageDeb \
            "-Pbitchord.version=${{ inputs.version }}"

      - name: Build AppImage
        shell: bash
        run: |
          mkdir -p dist
          desktopApp/packaging/appimage.sh \
            desktopApp/build/compose/binaries/main/app/BitChord \
            "dist/BitChord-${{ inputs.version }}-linux-x86_64.AppImage" \
            "$PWD/appimagetool.AppImage"

      - name: Collect DEB
        shell: bash
        run: |
          deb=$(find desktopApp/build/compose/binaries/main/deb -maxdepth 1 -type f -name '*.deb' | head -n 1)
          if [ -z "$deb" ]; then
            echo "No .deb package found"
            exit 1
          fi
          cp "$deb" "dist/BitChord-${{ inputs.version }}-linux-amd64.deb"
          chmod +x "dist/BitChord-${{ inputs.version }}-linux-x86_64.AppImage"
          ls -lh dist

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-DEB-${{ inputs.version }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-AppImage-${{ inputs.version }}
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 14
