name: Android APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure optional debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            test -s "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build production debug APK
        run: ./gradlew --no-daemon assembleProdDebug

      - name: Upload production debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-prod-debug
          path: app/build/outputs/apk/prod/debug/*.apk
          if-no-files-found: error

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        run: |
          printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > local.properties
          printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
          printf 'LISTEN_TOGETHER_SERVER=%s\n' "$LISTEN_TOGETHER_SERVER" >> local.properties

          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure $name in repository Actions secrets to build a signed release."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > bitchord-release.jks
          test -s bitchord-release.jks || {
            echo "::error::KEYSTORE_BASE64 did not decode to a keystore."
            exit 1
          }
          {
            printf 'storeFile=bitchord-release.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 bitchord-release.jks keystore.properties local.properties

      - name: Build signed production release APKs
        run: ./gradlew --no-daemon assembleProdRelease

      - name: Upload signed production release APKs
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-prod-release-signed
          path: app/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error

      # Built by the same release task, with the same key. The watch app only
      # pairs with a phone app signed by that key.
      - name: Upload signed Wear OS release APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-wear-prod-release-signed
          path: wearos/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error
