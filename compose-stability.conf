// Classes the Compose compiler treats as stable even though it never analyses
// them: they come from :shared, a module it does not run on, so without this
// every composable taking a Song, a shelf or a lyric line compares it by
// identity and recomposes whenever a fresh but equal copy is handed in.
//
// Only immutable classes belong here — all-val, and lists that are replaced
// rather than mutated. A class listed here that changes in place will stop
// redrawing when it does.
com.music.bitchord.data.model.*
com.music.bitchord.data.lyrics.LyricLine
com.music.bitchord.data.lyrics.LyricWord
com.music.bitchord.data.lyrics.LyricSyllable
