name: Automix Mix button + ban muot (release-like)

# Chay tay: tab Actions -> chon workflow nay -> Run workflow.
# Gom: nut Mix (bat/tat + chinh do dai/kieu) trong hang cho, va lop override tung cap bai.
# Build "benchmark": co R8 + baseline profile, khong debuggable, ky bang khoa debug,
# goi rieng com.dev.bitchord.benchmark nen cai song song voi ban dev/prod.
# Nhanh va muot hon han ban debug. Khong commit gi vao repo cua ban.

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Chay them test truoc khi build (lau hon)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Apply the Automix override changes
        run: |
          echo "" | base64 -d | tar -xz
          patch -p1 < automix-override-v1.patch
          rm automix-override-v1.patch

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=" > local.properties
          echo "LASTFM_SECRET=" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=" >> local.properties

      - run: chmod +x gradlew

      - name: Shared tests
        if: ${{ inputs.run_tests }}
        run: ./gradlew :shared:jvmTest

      - name: Build the release-like dev APK
        run: ./gradlew assembleDevBenchmark

      - name: List the APKs
        run: ls -la app/build/outputs/apk/dev/benchmark/

      - name: Upload the arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-dev-benchmark-arm64
          path: app/build/outputs/apk/dev/benchmark/*arm64-v8a*.apk
          if-no-files-found: error
