<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <title>BitChord: lyric sources</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap" />
  </head>
  <body>
    <main class="card">
      <img src="/icon/48.png" width="40" height="40" alt="" />
      <h1>Allow lyric sources</h1>
      <p>
        These lyric providers don’t let web pages ask them directly, so BitChord asks through the extension. Your
        browser will ask you to confirm.
      </p>
      <ul id="hosts"></ul>
      <button id="allow">Allow</button>
      <p id="status" class="status" role="status"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
