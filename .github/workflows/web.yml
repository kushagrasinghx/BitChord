name: Web

# The web player (web/app), its browser extension (web/extension) and the code
# they share (web/shared): typecheck, test and build all three, so a change
# that only breaks the production build (Vite, WXT) is caught before it ships.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web · typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from web/package.json's packageManager.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The app's build runs tsc then vite; the extension builds all three browsers.
      # The real party server is a Cloudflare Pages variable; this build is
      # never deployed, it only needs a value to get past vite.config.ts.
      - name: Build
        run: pnpm build
        env:
          VITE_PARTY_SERVER_URL: https://party.example.com

  safari:
    name: Safari · unsigned macOS app
    runs-on: macos-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir extension package:safari
      - name: Verify development app signatures and entitlements
        run: node --test extension/tests/safari-native.test.mjs
      - name: Archive unsigned app
        run: ditto -c -k --keepParent extension/.output/safari-native/build/Build/Products/Release/BitChord.app extension/.output/BitChord-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-Safari-unsigned
          path: web/extension/.output/BitChord-unsigned.zip
