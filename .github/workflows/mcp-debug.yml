name: MCP Debug APK

on:
  workflow_dispatch:
  push:
    branches: ['feat/android-mcp']
    paths:
      - 'app/**'
      - 'shared/**'
      - 'sharedUi/**'
      - 'wearos/**'
      - 'native/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/mcp-debug.yml'

permissions:
  contents: read

concurrency:
  group: mcp-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build dependencies
        run: sdkmanager 'platforms;android-37' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.0.12077973'
      - name: Run phone unit tests
        run: ./gradlew :app:testDevDebugUnitTest --stacktrace
      - name: Build installable development APK
        run: ./gradlew :app:assembleDevDebug --stacktrace
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-mcp-dev-${{ github.run_number }}
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-test-reports-${{ github.run_number }}
          path: app/build/reports/tests/
          if-no-files-found: ignore
